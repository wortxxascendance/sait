<script src="assets/ts.js"></script>
<script>
// фильтр работ по типу машины
document.querySelectorAll('.flt button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.flt button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  document.querySelectorAll('#works button').forEach(w => { w.hidden = b.dataset.f !== 'all' && w.dataset.k !== b.dataset.f });
}));
</script>
